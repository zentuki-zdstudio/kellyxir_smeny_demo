:root{--ink:#202923;--muted:#79867d;--line:#e7eae4;--bg:#f7f8f5;--white:#fff;--dark:#1e302a;--dark2:#28483c;--lime:#dce9d8;--accent:#33654f;--accentlight:#ecf3ed;--amber:#b88045;--red:#b9685a;--redlight:#fbefec;--blue:#6d8d9b;--sh:0 2px 12px rgba(25,38,29,.018)}
html,body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid #42745b;outline-offset:3px}
.ui-icon{display:block;width:18px;height:18px;flex:none;vertical-align:middle;stroke-width:1.75}
svg{vertical-align:middle}
.app{background:var(--bg)}
.sidebar{width:228px;flex-basis:228px;background:#fff;color:#293a30;padding:30px 14px 18px;border-right:1px solid #e8ece6;box-shadow:none;z-index:4}
.brand{padding:3px 10px 56px;gap:11px;align-items:center}

.mark-dot{position:absolute;right:6px;top:7px;width:4px;height:4px;background:#b4d4a4;border-radius:50%}
.brandtext{font-size:15px;letter-spacing:.10em;font-weight:840;color:#20372b;line-height:1.12}
.brandtext small{font-size:9px;letter-spacing:.17em;color:#9ba69c;margin-top:6px;font-weight:700}
.navlabel,.sidebar-label{color:#9ba69d;font-size:10px;letter-spacing:.125em;font-weight:760;padding:0 12px 14px}
.nav{gap:5px}
.navbtn{color:#68776b;min-height:44px;border-radius:9px;padding:11px 12px;font-size:13px;font-weight:620;gap:13px;transition:background .12s ease,color .12s ease}
.navbtn .ui-icon{width:18px;height:18px;stroke-width:1.85;color:#8c9a8f}
.navbtn:hover{background:#f4f7f2;color:#274837}
.navbtn.active{background:#edf3eb;color:#24533d;font-weight:750}
.navbtn.active .ui-icon{color:#32654c}

/* Kellyxír SHIFT · Nocturne, v3 */
:root{
 --ink:#e9efeb;--muted:#92a19e;--line:#2b3639;--bg:#101619;--white:#192126;
 --dark:#0d1316;--dark2:#1a2b29;--lime:#b8dec0;--accent:#a1d6b5;--accentlight:#243b35;
 --amber:#e1ad77;--red:#ee988c;--redlight:#38272b;--blue:#94aebc;--sh:0 10px 24px rgba(1,5,6,.14);
}
html,body{color:var(--ink);background:var(--bg);color-scheme:dark}
.app{background:radial-gradient(ellipse 64% 43% at 89% -9%,rgba(45,91,78,.19),transparent 77%),linear-gradient(155deg,#10181b 0%,#101619 54%,#101519 100%)}
button,input,textarea,select{color:inherit}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #acdcb9;outline-offset:2px}
.ui-icon{width:18px;height:18px;display:block;flex:0 0 auto;stroke-width:1.8}
/* Sidebar */
.sidebar{background:#0b1114;border-right:1px solid #253136;color:#e8efec;box-shadow:none}
.brand{padding-bottom:52px}
.mark{background:linear-gradient(145deg,#26493c,#1a342e);border:1px solid #386049;color:#e8f4e9;box-shadow:0 5px 14px #050c0e45}
.mark-dot{background:#e3b784}
.brandtext{color:#f2f5f0}
.brandtext small,.navlabel,.sidebar-label{color:#788b86}
.navbtn{color:#94a8a0}
.navbtn .ui-icon{color:#7e958c}
.navbtn:hover{background:#1d292a;color:#f0f6f1}
.navbtn.active{background:linear-gradient(100deg,#243d35,#1b2d2c);color:#d3f1df;box-shadow:inset 3px 0 #a6d7b4}
.navbtn.active .ui-icon{color:#abdfbe}
.navbtn .count,.navbtn.active .count{background:#34423d;color:#c2e1cf}
.side-bottom{border-color:#273336}
.workplace{background:#151e20;border:1px solid #253338}
.workplace-symbol{background:#1e3731;border-color:#375247;color:#ccecd4}
.workplace strong{color:#e7f0ea}.workplace small{color:#7d9188}
.workplace-status{background:#91cc9c;box-shadow:0 0 0 3px #91cc9c20}
/* Top header */
.topbar{background:rgba(13,19,22,.86);border-bottom:1px solid #273236;backdrop-filter:blur(14px)}
.crumb-root,.breadcrumbs{color:#7b8e88}.breadcrumbs strong{color:#d9e7df}.crumb-slash{color:#536460}
.mode-label{color:#7d8c87}
.mode{background:#162125;border-color:#2b383a}
.mode button{color:#839892}.mode button.active{background:#30483f;color:#e3f4e8;box-shadow:none}
.header-divider{background:#2b3638}.bell{color:#9eafa6;background:transparent}.bell:hover{background:#233330}
.avatarbtn{color:#d9e7dd}.avatarbtn .avatar{background:#30463c!important;color:#dceede}.avatarbtn>.ui-icon{color:#819a8f}
/* Page and typography */
.main{max-width:1720px;padding-top:36px}
.eyebrow{color:#9ccaac}
.pagehead h1{color:#f0f4ef;letter-spacing:-.048em;font-weight:760}
.pagehead p,.metricfoot,.minihelp{color:#93a4a0}
h1,h2,h3,strong,b{color:inherit}
.pagehead{margin-bottom:26px}
/* Buttons */
.btn{border-radius:9px;background:#222e30;color:#e2eee5;border:1px solid #344245;min-height:39px;box-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;transition:background .15s,border-color .15s,transform .15s}
.btn .ui-icon{height:16px;width:16px}
.btn:hover{background:#2c3c3d;border-color:#557468;transform:none}
.btn.primary,.btn.green{background:linear-gradient(115deg,#bfe5c2,#91cba7);color:#162a20;border:1px solid #bce6c5;font-weight:800}
.btn.primary:hover,.btn.green:hover{background:linear-gradient(115deg,#d2f1d3,#abd9b6);border-color:#d2f1d3}
.btn.outline{background:#1b2928;border-color:#355348;color:#c8e8d3}
.btn.outline:hover{background:#253a34}
.btn.danger{background:#302528;border:1px solid #664448;color:#f3aaa0}
.btn.danger:hover{background:#463035;border-color:#b16a68}
.btn.danger-solid{background:#a85150;border-color:#bb6563;color:#fff3ee}
.btn.danger-solid:hover{background:#ba5b58}
.btn:disabled{opacity:.4}
/* Cards, data panels */
.metric,.panel,.teamcard,.day,.issue{background:#192226;border:1px solid #2b393d;box-shadow:none;border-radius:12px}
.metric{background:linear-gradient(153deg,#1d292b,#192226 80%);padding:21px 22px}
.metriclabel,.metricfoot{color:#8c9e98}
.metricnum{color:#edf5ee;font-size:28px;margin-top:17px}
.metric-icon{background:#253831;color:#acd5b8;border-radius:8px}
.metric-icon .ui-icon{color:#addcbb}
.panelheading{border-color:#2a3639}
.panelheading h2,.paneltitle h2,.sectiontop h2{color:#edf3ef}
.panelheading p,.panelsub{color:#91a09b}
.mutelink{color:#a8d8b5;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mutelink:hover{color:#d2f0d8}
.mutelink .ui-icon{height:14px;width:14px}
.progress{background:#2b3838}
.progress>div{background:linear-gradient(90deg,#65a886,#b1dfad)}
.pill{background:#24372f;color:#b8dec1;border:1px solid #365447}
.pill.warn{background:#392d24;color:#ecc08b;border-color:#634932}
.pill.red{background:#3b292e;color:#e7a09a;border-color:#674046}
.pill.blue{background:#26343c;color:#b0c8d2;border-color:#40525f}
/* Manager overview */
.week-state{background:linear-gradient(95deg,#1c2d2b,#1c2628);border:1px solid #30483f;color:#dae9df}
.week-state-main{color:#b9cec1}.week-state-main strong{color:#e2f5e8}
.week-state-track{background:#34463c}.week-state-track span{background:linear-gradient(90deg,#629b79,#add8af)}
.week-state-pct{color:#c3e3c6}
.daylist{padding-bottom:12px}
.dayline{color:#dfe9e2;border-color:#2a3739}
.dayline:hover{background:#223332}
.dayline-date{background:#232f30;border-color:#344344}
.dayline-date b,.dayline-info b{color:#e1eee3}
.dayline-date small,.dayline-info small{color:#839a8d}
.dayline.current .dayline-date{background:#284639;border-color:#4b7460}
.dayline.current .dayline-date b{color:#d4f2d8}
.dayline-status{background:#233e33;color:#a9dfb6}
.dayline-status.attention{background:#3a3025;color:#ecc394}
.dayline>.ui-icon{color:#72867f}
.alertitem{border-color:#2b373a}.alertitem:hover{background:#22302e}
.alert-info b{color:#e4eee6}.alert-info small{color:#8f9f98}
.alertitem>.ui-icon{color:#607b70}
.alertico{background:#392f27;color:#e0ad7a}
.panelbottom{background:#1a292a;color:#a9d9b9;border-color:#2d3c3c}
.panelbottom:hover{background:#233834}
.budget-panel .panelheading>.ui-icon{color:#95b39f}
.budgetnumbers b{color:#e8f5e8}.budgetnumbers span,.budgetfoot{color:#8ea69a}
/* Staff overview */
.myhero{background:radial-gradient(circle at 88% 15%,#4b87653b,transparent 35%),linear-gradient(118deg,#203e35,#17282b 77%);border:1px solid #3b5c4a;min-height:216px;box-shadow:0 10px 24px #020a0a25}
.myhero .hero-button{background:#d5efd9;color:#1a3527;border-color:#d5efd9}
.myhero .hero-button:hover{background:#effcf0}
.hero-kicker{color:#bce0c5}.hero-day,.myhero p{color:#c8dacf}
.hero-watermark{color:#ffffff0b}
.shift-row{background:#1c2729;border:1px solid #324041;color:#e5efe8}
.shift-row:hover,.shift-row.interactive:hover{background:#253534;border-color:#486656}
.shift-row .info b{color:#ecf3ed}.shift-row .info small{color:#8fa69b}
.shift-row .datebox,.datebox{background:#2c4239;color:#c5e8cc}
.shift-duration{background:#294335;color:#c9e9cb}
.panelnote{background:#1b2727;color:#95aaa0;border-color:#2d3c3c}
.empty.compact,.empty.compact strong,.empty.compact span{color:#9caea5}
.empty.compact .ui-icon{color:#8bb69b}
/* Calendar toolbar and modes */
.calendar-toolbar{gap:16px;margin:0 0 15px;min-height:42px}
.weekcontrols{gap:7px}
.weekrange{color:#e8f0e9;font-size:16px;letter-spacing:-.02em;padding:0 12px;min-width:160px;text-align:center;text-transform:capitalize}
.arrow{background:#1c282b;border:1px solid #344244;color:#c4d6ca;border-radius:9px}
.arrow:hover{background:#2a3a39;border-color:#527063}
.arrow .ui-icon{height:18px;width:18px}
.goto-now{margin-left:8px;background:#23312f;border-color:#344b42;color:#c9e8cf}
.calendar-toolbar-right{display:flex;align-items:center;gap:14px}
.view-switch{display:inline-flex;align-items:center;gap:2px;padding:3px;background:#192326;border:1px solid #344145;border-radius:10px}
.view-switch button{border:0;background:transparent;color:#9cafa5;padding:8px 16px;font-size:12px;font-weight:730;border-radius:7px;min-width:69px}
.view-switch button.active{background:#344e40;color:#dff4e6;box-shadow:0 2px 7px #07100d60}
.view-switch button:hover{color:#edf6ed}
.calendar-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#94a89c;font-size:11.5px;margin:0 0 14px}
.calendar-summary span+span{border-left:1px solid #384642;padding-left:14px}
.calendar-summary .text-warn{color:#e5bd8d}
/* Monthly calendar */
.month-frame{border:1px solid #304044;border-radius:13px;background:#182125;overflow:hidden;box-shadow:0 8px 28px #03090924}
.month-headings{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid #2b3a3c;background:#1b282b}
.month-headings>span{padding:12px 14px;text-transform:uppercase;letter-spacing:.09em;color:#a7bcb0;font-size:10px;font-weight:750}
.month-headings>span:nth-child(n+6){color:#ddb68b}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.month-day{position:relative;min-width:0;min-height:132px;border-right:1px solid #2a3639;border-bottom:1px solid #2a3639;padding:8px 8px 6px;overflow:hidden;transition:background .14s}
.month-day:nth-child(7n){border-right:0}
.month-day:hover{background:#202e2e}
.month-day.outside{background:#151c20}
.month-day.outside .day-select{opacity:.52}
.month-day.outside .month-shifts{opacity:.5}
.month-day.selected{background:linear-gradient(165deg,#263e36,#202e2c 77%);box-shadow:inset 0 0 0 1px #75ac89}
.month-day.today .day-select>span{background:#b4ddb8;color:#162c21;border-radius:6px;box-shadow:0 1px 6px #04110b30}
.day-select{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:none;background:transparent;text-align:left;color:#d6e3d8;padding:0 0 6px;min-height:25px}
.day-select>span{font-size:13px;font-weight:790;display:inline-grid;place-items:center;width:25px;height:25px}
.day-select small{font-size:9px;font-weight:650;color:#889e91;white-space:nowrap}
.month-shifts{display:grid;gap:4px}
.month-chip{border:1px solid #354e44;background:#263d35;border-radius:5px;color:#dcf0de;padding:4px 6px;display:flex;align-items:center;gap:5px;font-size:10px;text-align:left;min-width:0;min-height:22px;width:100%}
.month-chip:hover{background:#375546;border-color:#6f9a7c}
.month-chip .chip-time{font-variant-numeric:tabular-nums;color:#a6d4b0;font-size:9.6px;font-weight:740;flex:0 0 35px}
.month-chip .chip-person{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.month-chip.open{background:#3b3027;border-color:#5e4837;color:#f2c796}
.month-chip.open .chip-time{color:#ebbd84}
.month-chip.mine{background:#2e4a3b;border-color:#669a72}
.more-shifts{border:0;background:transparent;color:#c5d6cb;font-weight:700;font-size:10px;padding:2px 4px;text-align:left}
.more-shifts:hover{color:#e9f4e9}
.missing-count{position:absolute;bottom:7px;right:7px;border-radius:7px;padding:1px 5px;background:#56402c;color:#efc390;font-weight:800;font-size:9px}
.month-dots{display:none}
/* Daily agenda below month */
.selected-panel{margin-top:18px}
.small-eyebrow{font-size:10px;letter-spacing:.11em;color:#9bc5a8;font-weight:760}
.selected-panel .panelheading{padding-top:19px;padding-bottom:17px}
.selected-panel .panelheading h2{margin-top:3px;font-size:17px}
.selected-list{padding:4px 18px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.selected-shift{width:100%;min-width:0;border:1px solid #344343;background:#202c2e;color:#e8eee9;border-radius:9px;display:flex;align-items:center;text-align:left;padding:13px 14px;gap:13px}
.selected-shift:hover{border-color:#6e9b7b;background:#2a3c37}
.selected-time{min-width:50px;display:grid;color:#ccead1;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.selected-time small{color:#8ca59b;font-size:10px;font-weight:650}
.selected-info{display:grid;gap:3px;min-width:0;flex:1}
.selected-info strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected-info small{font-size:11px;color:#92a69b}
.selected-state{font-size:10px;color:#a3d9b1;background:#2b4435;padding:5px 8px;border-radius:5px;white-space:nowrap}
.selected-state.unfilled{color:#ebbf84;background:#4a3829}
.selected-shift>.ui-icon{width:14px;height:14px;color:#849c8c}
.selected-empty{padding:18px;color:#91a49a;grid-column:1/-1;font-size:12px}
/* Weekly calendar */
.calendar{gap:9px}
.day{min-height:284px}
.day.today{border-color:#6b9778;box-shadow:inset 0 0 0 1px #5f8871}
.dayhdr{background:#202c2d;border-color:#334142}
.dayhdr small,.daystatus{color:#9eaFA4}.dayhdr b{color:#e6f2e7}
.daybody{background:#192225}
.shiftchip{background:#263a34;border-color:#365b48;border-left-color:#87b99a;color:#e3f0e8}
.shiftchip:hover{background:#304a3e}
.shiftchip.open{background:#3d3329;border-color:#685139;border-left-color:#dfaa70}
.shiftchip.mine{background:#304b3c;border-color:#547f60}
.shiftchip small{color:#aad8b4}.shiftchip.open small{color:#e8b788}
.shiftchip span{color:#a2b7a7}.shiftchip b{color:#e4f1e7}
.dayadd{background:#212c2b;color:#a8dac0;border-color:#4e6b59}
.dayadd:hover{background:#2a4137}
.emptyday{color:#81968c}
.legend{color:#8c9f95;margin-top:13px}
.dot.dark{background:#85bb98}.dot.amber{background:#dca46d}.dot{background:#a6c5aa}
.review-section{margin-top:24px}
.issue{color:#e2eee8;cursor:pointer;text-align:left;transition:border-color .16s,background .16s}
.issue:hover{background:#22312e;border-color:#557c68}
.issue .tag{color:#d9ac78}.issue b{color:#e1efe3}.issue p{color:#8fa59a}
/* Forms and remaining views */
.reqcard{background:#202b2d;border-color:#324044;color:#e4eee7}
.reqcard:hover{background:#253336}
.reqleft h3,.reqtitle{color:#e5eee7}.reqleft p,.reqleft small{color:#91a79c}
.reqbubble{background:#2b453a;color:#b5ddc2}
.tabhead{border-color:#2a3a3b}
.tab{color:#91a69b}
.tab.active{background:#304639;color:#d6f3dd;border-color:#537960}
.teamcard:hover{background:#243330;border-color:#5a8970}
.teamperson b,.teamstats strong{color:#eaf2e9}
.teamperson small,.teamstats{color:#8eaaa0}
.teamstats{border-color:#2e3d3e}
.teamcard .minihelp{color:#a8cbb2}
.field label{color:#b5c9bb}
.field input,.field select,.field textarea,.field>textarea{background:#111b1f;border:1px solid #35484a;color:#e3efea;min-height:42px;border-radius:8px}
.field input::placeholder,.field textarea::placeholder{color:#81948b;opacity:1}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#99caac!important;box-shadow:0 0 0 3px #7cad9930}
.field input[type="date"]::-webkit-calendar-picker-indicator,.field input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.72}
.formactions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:9px}
.formactions-left{margin-right:auto}
.inlinebox,.hintbox{background:#1c2a2c;border:1px solid #314442;color:#a9beb2}
.inlinebox b,.hintbox b{color:#d9efdc}
.notice{background:#20352e;border-color:#3e5849;color:#c3dec9}
.notice.warn{background:#3e3128;border-color:#624d35;color:#efc695}
.alertrow{border-color:#324143}.alertrow b{color:#eaf1ea}.alertrow p{color:#98aca2}
.availday{background:#1c292a;border-color:#334443;color:#e8f1e7}
.availday:hover{background:#263936;border-color:#679077}
.availday b{color:#e4f2e8}.availday .stat{background:#2c4937;color:#c2e8c9}
.availday.off{background:#322729;border-color:#66484a}.availday.off .stat{background:#543638;color:#e9b1a6}
.profilehero{border-color:#344441}.profilehero h2{color:#e6f1e7}.profilehero p{color:#9aafa4}
/* Modal dialogs */
.modalcover{background:#030808be;backdrop-filter:blur(5px)}
.modal{background:#182225;border:1px solid #3b4b4e;color:#e9f0ea;box-shadow:0 24px 70px #0009;border-radius:15px}
.modalheader{border-color:#2e3e3e;background:linear-gradient(130deg,#1e302c,#1b2628)}
.modalheader h2{color:#eef5ee}.modalheader p{color:#a0b8a8}
.close{background:#263535;color:#b7cbc0;border:1px solid #385147}
.close:hover{background:#314941}
.modalcontent{color:#e5f0e6}

 --dark:#171e1b;--dark2:#204337;--accent:#285d48;--accentlight:#e4eee4;
 --amber:#94502d;--red:#a45145;--redlight:#f8e9e3;--blue:#536c78;
 --ivory:#f6f0e3;--forest:#1e4639;--forest-deep:#182f28;
 --copper:#a76240;--sage:#d9e2d5;--paper:#fbf9f3;
 --sh:0 8px 28px rgba(39,42,31,.045);
}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #af784d;outline-offset:2px}
.app{background:radial-gradient(ellipse 47% 25% at 90% 3%,rgba(204,218,198,.3),transparent 80%),radial-gradient(ellipse 30% 24% at 30% 78%,rgba(222,201,175,.19),transparent 85%),var(--bg)}
/* Sidebar: an ink-black spine with an engraved monogram */
.sidebar{background:linear-gradient(165deg,#19231e,#111b18 72%);border-right:1px solid #26382d;color:#ebe8dd;box-shadow:6px 0 22px #182b2310}
.sidebar::before{content:'';position:absolute;inset:0 0 auto;height:230px;background:radial-gradient(circle at 5% 10%,rgba(144,178,143,.11),transparent 65%);pointer-events:none}
.brand{padding:12px 11px 57px;position:relative;align-items:center}
.mark{width:43px;height:43px;border:1px solid rgba(199,171,126,.45);border-radius:50% 50% 47% 47%;background:radial-gradient(circle at 25% 0%,#37674e 0%,#16372c 66%);color:#f0e3c9;box-shadow:inset 0 0 0 3px #1a392f,0 6px 16px #060e0b40;font:italic 29px/1 Georgia,'Times New Roman',serif;letter-spacing:-.11em}
.mark-dot{width:4px;height:4px;background:#d2a879;right:8px;top:9px}
.brandtext{font-size:14px;font-weight:800;letter-spacing:.15em;color:#f7f0e1}.brandtext small{color:#b8c1ad;letter-spacing:.21em;font-size:8px;margin-top:7px}
.navlabel{color:#b0baab;letter-spacing:.16em;font-size:9px;margin-left:13px}
.navbtn{margin:3px 0;min-height:44px;padding:12px 14px;color:#c5cec1;border-radius:8px;font-weight:570;letter-spacing:.005em}
.navbtn .ui-icon{color:#a7b9ab;width:18px;height:18px}
.navbtn:hover{background:#2a392f;color:#fff8eb}.navbtn:hover .ui-icon{color:#f4eddf}
.navbtn.active{background:#dce3d5;color:#1b4231;box-shadow:inset 3px 0 #bd835d;font-weight:740}
.navbtn.active .ui-icon{color:#27543d}
.navbtn .count,.navbtn.active .count{background:#82634a;color:#fff4df}
/* Header: quieter than calendar; divide with a warm hairline */
.topbar{background:rgba(252,250,245,.94);border-bottom:1px solid #e7e1d4;backdrop-filter:blur(16px)}
.topbar:after{content:'';position:absolute;left:0;bottom:-1px;width:90px;height:1px;background:#aa8165}
.breadcrumbs,.crumb-root{color:#7c8779}.breadcrumbs strong{color:#2d4636}
.mode-label{color:#818c7d;font-size:9px;letter-spacing:.11em}
.mode{background:#efeee7;border:1px solid #e0ded3;border-radius:9px}
.mode button{color:#5e7061;border-radius:7px}.mode button.active{background:#264c3d;color:#f7f1e2;box-shadow:0 3px 8px #203b2a20}
.bell,.mobmenu{color:#405846}.bell:hover,.mobmenu:hover{background:#e9eee6}
.avatarbtn .avatar{background:#e4e7dd!important;color:#2b4e3e}.avatarbtn .who{color:#344c3d}
.main{padding-top:36px;max-width:1680px}
/* Editorial type hierarchy: serif only where it's expressive, never for controls */
.eyebrow,.small-eyebrow,.hero-kicker{color:#6d796a;letter-spacing:.17em;font-size:10px;font-weight:810}
.eyebrow:before{content:'✧';font:normal 17px/0 Georgia,serif;color:#ae7856;margin-right:8px;vertical-align:-2px}
.pagehead{margin-bottom:25px;align-items:center;gap:22px}
.pagehead h1{font:normal clamp(35px,3.5vw,48px)/1.02 Georgia,'Iowan Old Style','Times New Roman',serif;letter-spacing:-.048em;color:#26392d;margin:9px 0 10px}
.pagehead h1::after{content:'';display:inline-block;width:7px;height:7px;margin-left:9px;margin-bottom:4px;background:#c28d6b;border-radius:50%}
.pagehead p{color:#757b70;font-size:12.5px}
.headactions{gap:9px}
.btn{border-radius:8px;min-height:39px;background:#fbfaf4;color:#2e5541;border-color:#d9dfd3;font-weight:700;box-shadow:none}
.btn:hover{background:#eef2e9;border-color:#bfcfbd;box-shadow:0 5px 12px #213e2d12;transform:translateY(-1px)}
.btn.primary,.btn.green{background:#244e3c;color:#fbf5e8;border:1px solid #244e3c;box-shadow:0 5px 12px #1f3b2b1b}
.btn.primary:hover,.btn.green:hover{background:#1a3c2e;color:#fff9ea;border-color:#1a3c2e}
.btn.outline{background:#fffcf6;color:#315f49;border-color:#bacbb7}
.btn.danger{background:#fffbf6;color:#a34a40;border-color:#e4d0c7}
.btn.danger-solid{background:#a3473f;color:#fff8ee;border-color:#a3473f}
.btn.small{min-height:35px}
.ui-sparkle{color:#aa7251;font-size:14px;margin-right:4px}
/* Calendar toolbar: month becomes a proper editorial section title */
.calendar-toolbar{margin:2px 0 15px;gap:14px;align-items:center}
.weekcontrols{gap:9px}
.weekrange{font:normal 24px/1.1 Georgia,'Iowan Old Style',serif;color:#293d30;letter-spacing:-.035em;min-width:206px;padding:0 8px}
.arrow{background:#fffcf6;border:1px solid #dddcd0;color:#3e624c;width:36px;height:36px;border-radius:8px}
.arrow:hover{background:#e9efe6;border-color:#b8ceb7}
.goto-now{margin-left:4px;background:#e9ede5;border:1px solid #dce2d5;color:#2e5640;border-radius:8px}
.calendar-toolbar-right{gap:10px}
.view-switch{background:#e9eae1;border:1px solid #dcded4;border-radius:9px;padding:3px}
.view-switch button{padding:8px 15px;color:#637266;font-weight:740;border-radius:6px}
.view-switch button.active{background:#264b3b;color:#faf4e8;box-shadow:0 2px 7px #20362824}
.view-switch button:hover{color:#27523d}.view-switch button.active:hover{color:#fff8ec}
.calendar-summary{color:#6b776b;gap:12px;font-size:11.5px;margin-bottom:14px}
.calendar-summary span+span{border-color:#d6dbcf;padding-left:12px}.calendar-summary .text-warn{color:#965333}
.pill.warn{background:#f0dfce;border:1px solid #ebcfb5;color:#8a4828;font-weight:750}
.pill{background:#e5ede0;color:#2a6448;border:1px solid #c9dac8}
/* Calendar: loose paper grid, contrast through shape rather than blocks of color */
.month-frame{background:#fffdf7;border:1px solid #d7d8cb;box-shadow:0 17px 40px #2e3e3010;border-radius:12px;overflow:hidden}
.month-headings{background:#e6e9dc;border-bottom:1px solid #dadbcd}
.month-headings>span{font-size:10px;color:#435f4b;letter-spacing:.18em;font-weight:800;padding:13px 12px}
.month-headings>span:nth-child(n+6){color:#9c6340}
.month-day{min-height:130px;padding:7px 8px 7px;background:#fffcf6;border-color:#ebe7dd;overflow:hidden;transition:background .16s ease,box-shadow .16s ease}
.month-day:hover{background:#f6f7ef;box-shadow:inset 0 0 0 1px rgba(123,157,119,.3)}
.month-day.outside{background:#f7f5ee}.month-day.outside:hover{background:#f0f2e9}
.month-day.outside .day-select,.month-day.outside .month-shifts{opacity:.57}
.month-day.selected{background:#eef2e8;box-shadow:inset 0 0 0 1.5px #9bb7a0}
.month-day.selected:before{content:'';height:3px;position:absolute;top:0;left:0;right:0;background:#37624c}
.day-select{display:flex;justify-content:space-between;align-items:center;min-height:30px;padding:0 20px 4px 0;color:#274233}
.day-select>span{font:normal 17px/1 Georgia,'Times New Roman',serif;width:25px;height:25px;letter-spacing:-.025em}
.day-select small{font-size:9px;font-weight:650;color:#8b9486}
.month-day.today .day-select>span{background:#214e3b;color:#faf2e4;border-radius:50%;font:normal 15px/1 Georgia,serif;box-shadow:0 2px 9px #183e3020}
.month-shifts{gap:4px}
.month-chip{min-height:23px;padding:4px 6px;border:1px solid #d5e4d5;border-left:3px solid #3b7659;background:#e8f0e6;border-radius:4px;color:#284b39;font-size:10px;gap:5px;box-shadow:none;transform:none}
.month-chip .chip-time{color:#315e45;font-size:9.6px;font-weight:850;flex-basis:35px}
.month-chip .chip-person{color:#294d38;font-weight:720}
.month-chip.open{background:#faede1;border-color:#ecd2bf;border-left:3px solid #ab7049;color:#7b462b}
.month-chip.open .chip-time,.month-chip.open .chip-person{color:#7b462b}
.month-chip.mine{background:#d9e8d8;border-color:#a6c6aa;border-left-color:#27543c}
.month-chip:hover,.month-chip.open:hover{background:#f0f0de;border-color:#a9c1a6;box-shadow:0 2px 8px #234f361a;transform:translateX(2px)}
.month-chip.open:hover{background:#f7e4d1;border-color:#cba07e}
.more-shifts{color:#2e6648;padding:3px 2px;font-size:10px}
.missing-count{background:#895239;color:#fff6e9;bottom:6px;right:7px;font-size:9px;padding:2px 5px;border-radius:20px}
/* Tiny, unobtrusive plus. Desktop hover/focus, no needless permanent controls. */
.month-add{top:5px;right:5px;bottom:auto;left:auto;width:25px;height:25px;min-width:25px;min-height:25px;border:0;border-radius:50%;box-shadow:none;background:transparent;color:#315d47;opacity:0;transform:scale(.86);transition:opacity .16s ease,background .16s ease,transform .16s ease;color-scheme:light}
.month-add .ui-icon{width:13px;height:13px;stroke-width:2.15}
.month-day:hover .month-add,.month-day:focus-within .month-add,.month-add:focus-visible{opacity:1;transform:scale(1)}
.month-add:hover{background:#25543f;color:#fff7eb;box-shadow:none}
.month-day.outside .month-add{opacity:0}.month-day.outside:hover .month-add,.month-day.outside:focus-within .month-add{opacity:1}
/* Context panel visually anchors the chosen day; also the add action on touch */
.selected-panel{margin-top:18px;background:#fffaf2;border:1px solid #dedacd;border-radius:12px;box-shadow:0 9px 25px #2f3c3010;overflow:hidden;position:relative}
.selected-panel:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#b58a64,#315b44)}
.selected-panel .panelheading{padding:17px 19px 15px 22px}
.small-eyebrow{color:#986e4b;letter-spacing:.15em;font-size:9px}
.selected-panel .panelheading h2{font:normal 24px/1.13 Georgia,'Times New Roman',serif;letter-spacing:-.025em;color:#273d30;margin:5px 0 5px}
.selected-panel .panelheading p{font-size:11px}
.selected-list{padding:0 15px 16px 21px;gap:10px}
.selected-shift{background:#f7f5ed;color:#344737;border-color:#e2e2d6;border-radius:8px;min-height:66px}
.selected-shift:hover{background:#edf3e9;border-color:#b5c9b4;transform:translateY(-1px)}
.selected-time{color:#315b43}.selected-time small{color:#788b77}.selected-info strong{color:#263e2e}.selected-info small{color:#788577}
.selected-state{background:#e2ede0;color:#2a5d41}.selected-state.unfilled{background:#f1e2d2;color:#865034}
.selected-shift>.ui-icon{color:#78917d}
.legend{font-size:11px;color:#68786b;gap:16px;margin-top:13px}.dot.dark{background:#3b7659}.dot.amber{background:#ba7e56}.dot{background:#9db69c}
/* Utility surfaces now serve information, not decoration */
.panel,.teamcard,.metric,.issue{background:#fffcf6;border:1px solid #e3dfd4;border-radius:11px;box-shadow:0 7px 20px #273d2a08}
.metric{background:#fffcf6;border-radius:10px}
.metric:hover,.teamcard:hover,.issue:hover{transform:translateY(-2px);box-shadow:0 11px 24px #273d2b13;border-color:#bfd1bd}
.metric-top{gap:8px}.metriclabel{color:#7b8376}.metricnum{font:normal 31px/1.15 Georgia,serif;color:#253c2e}.metricfoot{color:#83897e}
.metric-icon{background:#e7eee3;color:#33694e}.metric:nth-child(2) .metric-icon{background:#f5e6d9;color:#945e40}.metric:nth-child(3) .metric-icon{background:#eae8e2;color:#6d6571}
.panelheading{border-color:#e9e4da}.panelheading h2,.sectiontop h2{color:#2b4232}.panelheading p{color:#7b8779}
.week-state{background:linear-gradient(105deg,#1c4234,#284e3b);border-color:#3b614a;color:#faf3e7;border-radius:11px}
.week-state-main,.week-state-main strong,.week-state-pct{color:#faf4e8}.week-state-track{background:#4b6856}.week-state-track span{background:#dbc8a3}
.dayline-date{background:#f1efe6;border-color:#e3dfd4}.dayline.current .dayline-date{background:#e3ede0;border-color:#aac8ae}
.dayline-info b,.dayline-date b{color:#314a37}.dayline-status.attention{background:#f3e5d7;color:#895132}.dayline-status.complete{background:#e5f0e5;color:#2c6345}
.alertico{background:#f2e4d6;color:#925634}.alert-info b{color:#2b4232}.alert-info small{color:#798778}
.budgetnumbers b{color:#264531}.budgetfoot{color:#818879}
/* Next shift is a signature piece, not another rectangle with gradients */
.myhero{background:radial-gradient(ellipse at 90% 0%,rgba(209,188,137,.2),transparent 38%),linear-gradient(112deg,#17372e,#285643 80%);border:1px solid #3b6b54;color:#fff7e8;box-shadow:0 16px 32px #223e2b19;border-radius:12px;min-height:216px}
.myhero:before{content:'';position:absolute;z-index:1;right:9%;top:-73px;width:250px;height:250px;border:1px solid rgba(224,200,147,.17);border-radius:50%;box-shadow:0 0 0 28px rgba(224,200,147,.04),0 0 0 58px rgba(224,200,147,.025);pointer-events:none}
.hero-kicker,.hero-day,.myhero p{color:#ede9db}.myhero h2{font:normal clamp(34px,3.2vw,50px)/1.15 Georgia,serif;color:#fff8e9;letter-spacing:-.055em}
.myhero .hero-button{background:#f5e9d5;color:#204735;border-color:#f5e9d5}.myhero .hero-button:hover{background:#fff5e3;color:#1d3f31}
.hero-watermark{font-family:Georgia,serif;color:#ffffff0a}
.shift-row{background:#f6f5ed;border-color:#e2e4d9}.shift-row:hover,.shift-row.interactive:hover{background:#eef1e6;border-color:#b7ceb8}
.shift-row .info b{color:#2e4835}.shift-row .info small{color:#7a897a}.shift-row .datebox,.datebox{background:#e8eee2;color:#335c42}
.shift-duration{background:#dfeddf;color:#305c43}
.reqcard{background:#fffaf3;border-color:#e5e1d6}.reqcard:hover{background:#f5f5ec}
.reqbubble{background:#e9eddf;color:#365f48}.reqleft h3{color:#344c38}.reqleft small,.reqleft p{color:#748577}
.tab.active{background:#e3efdf;border-color:#a9c7ab;color:#285b40}
.teamcard:hover{background:#fbfbf5}.teamperson b{color:#324936}
.availday{background:#fffcf6;border-color:#e2e3d6}.availday.off{background:#f9eae3;border-color:#e7cfc4}.availday .stat{background:#e6f0e3;color:#2e6244}
/* Forms: functional contrast and deliberate spacing */
.modal{background:#fffcf6;border-radius:13px;border:1px solid #eee4d5;box-shadow:0 25px 75px #09150d55}
.modalheader{background:#f2efe6;border-color:#e5dfd4}.modalheader h2{font:normal 27px/1.12 Georgia,serif;color:#2d4434}
.field label{color:#3b5441}.field input,.field select,.field textarea,.field>textarea{background:#fffef8;border:1px solid #d6ded1;color:#263e2d;border-radius:7px;font-size:14px;min-height:45px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#577f63!important;box-shadow:0 0 0 3px #5a896b22}
.close{background:#e6e9df;color:#365943;border:1px solid #d4ddcf}.close:hover{background:#d7e4d8}
.notice.warn{background:#f4e6d7;color:#84512f;border-color:#e9c6ad}
.toast{background:#1f4836;color:#fff8ed;border-color:#2e644b;border-radius:8px}
/* Subtle motion only when it reinforces an affordance */
@keyframes riseIn{0%{opacity:.6;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
.month-frame,.selected-panel,.myhero{animation:riseIn .35s cubic-bezier(.17,.67,.32,1) both}
.month-chip,.btn,.tab,.navbtn,.selected-shift{transition:background-color .17s,border-color .17s,box-shadow .17s,transform .17s,color .17s}
/* Bottom dock for real one-handed use, not a tiny floating menu icon */
.mobile-dock{display:none}
@media(max-width:1160px){.main{padding-left:23px;padding-right:23px}.month-day{padding-left:6px;padding-right:6px}.month-chip{padding-left:4px;padding-right:4px;gap:4px}.month-chip .chip-time{flex-basis:31px}.weekrange{min-width:0}}
@media(max-width:850px){.sidebar{background:linear-gradient(160deg,#17211d,#111b18);box-shadow:14px 0 50px #111e1644}.topbar{height:60px;min-height:60px}.main{padding-top:24px}}
@media(max-width:700px){
 .app{background:#f5f2eb}
 .topbar{height:58px;min-height:58px;padding:0 12px;background:#fdfaf3}
 .mobmenu{background:#f2f2e9;border:1px solid #e0e2d8;border-radius:8px;height:35px;width:35px}
 .topright{gap:5px}
 .topright .mode-label,.topright .header-divider{display:none}
 .bell{display:none}
 .avatarbtn{padding:3px}.avatarbtn .who,.avatarbtn>.ui-icon{display:none}
 .mode{padding:2px;gap:1px}.mode button{font-size:11px;padding:7px 9px;min-height:28px}
 .main{padding:21px 13px calc(100px + env(safe-area-inset-bottom))}
 .pagehead{margin:0 0 20px;gap:14px;align-items:flex-start}
 .eyebrow{font-size:9px;letter-spacing:.14em}.pagehead h1{font-size:36px;line-height:1.07;margin:8px 0 8px}.pagehead p{font-size:12px;max-width:315px;line-height:1.5}
 .headactions{gap:7px;width:100%;display:grid;grid-template-columns:1fr 1fr}
 .headactions .btn{width:100%;font-size:11px;min-height:41px;padding:8px 7px;justify-content:center;gap:5px;white-space:normal}
 .headactions .ui-icon{width:14px;height:14px}
 .calendar-toolbar{gap:12px;margin:1px 0 11px;align-items:stretch}
 .weekcontrols{width:100%;gap:6px;justify-content:space-between}
 .weekrange{flex:1;font:normal 22px Georgia,serif;padding:0 4px;text-align:center}
 .arrow{width:35px;height:35px;flex:none}.goto-now{margin-left:0;padding:7px 10px}
 .calendar-toolbar-right{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
 .view-switch button{padding:7px 14px;font-size:11px}
 .calendar-summary{display:flex;gap:8px 10px;flex-wrap:wrap;margin:0 0 12px;font-size:11px;line-height:1.25}
 .calendar-summary span+span{padding-left:10px}
 .calendar-summary span:last-child{display:none}
 .month-frame{border-radius:10px}
 .month-headings>span{font-size:9px;padding:10px 2px;letter-spacing:.1em;text-align:center}
 .month-day{min-height:66px;padding:4px 1px 4px}
 .day-select{padding:0;justify-content:center;min-height:28px}
 .day-select>span{width:27px;height:27px;font-size:16px}
 .month-day.today .day-select>span{font-size:14px}
 .month-shifts{display:none}
 .month-dots{display:flex;margin:5px auto 0;justify-content:center;gap:3px;max-width:90%}
 .month-dots span{width:5px;height:5px;background:#427a59;border-radius:50%}.month-dots span.open{background:#b2774c}
 .month-add{display:none!important} /* mobile: tapping a day opens its visible add action below */
 .missing-count{bottom:5px;left:auto;right:4px;color:#9a5b39;background:transparent;padding:0;font-size:9px;font-weight:850}
 .month-day.selected:before{height:2px}
 .month-day.selected{background:#e5ede0;box-shadow:inset 0 0 0 1px #98b59b}
 .month-day.outside .month-dots{opacity:.48}
 .selected-panel{margin-top:12px;border-radius:10px}
 .selected-panel .panelheading{padding:15px 13px 12px 18px;gap:9px;align-items:center}
 .selected-panel .panelheading h2{font-size:21px}
 .selected-panel .panelheading .btn{padding:8px;font-size:11px;flex:none;min-height:38px}
 .selected-list{padding:0 10px 13px 15px;grid-template-columns:1fr}
 .selected-shift{min-height:59px;padding:11px}
 .legend{gap:12px;font-size:10px;margin-top:10px}
 .issuegrid{grid-template-columns:1fr;gap:8px}.issue{padding:14px 15px}
 .sectiontop{margin-top:22px}.sectiontop h2{font:normal 22px Georgia,serif}
 .cards{gap:9px}.metric{padding:15px}.metricnum{font-size:26px}.metric-icon{height:32px;width:32px}
 .panelheading h2{font-size:16px}
 .myhero{padding:23px 20px;min-height:195px}.myhero h2{font-size:36px}
 .mobile-dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(253,250,243,.97);backdrop-filter:blur(17px);border-top:1px solid #dedfd3;box-shadow:0 -9px 28px #1a32231a;padding:8px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));gap:4px}
 .dock-item{border:0;background:transparent;color:#748176;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-height:49px;padding:5px 1px 4px;font-size:10px;font-weight:690;border-radius:8px;position:relative}
 .dock-item .ui-icon{height:20px;width:20px;stroke-width:1.8}
 .dock-item.active{background:#e4ecdf;color:#285942}.dock-item.active:before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:#956241;border-radius:0 0 2px 2px}
 .dock-item:hover{background:#eef0e8;color:#285943}
 .dock-item:active{transform:scale(.96)}
 .toastbox{bottom:calc(85px + env(safe-area-inset-bottom));left:12px;right:12px}.toast{max-width:none}
 .modalcover{padding:10px;align-items:end}
 .modal{max-height:89dvh;border-radius:16px 16px 8px 8px;width:100%}

function ensureWeek(w){if(state.initializedWeeks.includes(w))return;if(weekShifts(w).length){state.initializedWeeks.push(w);persist();return}state.initializedWeeks.push(w);const structure=[
[['15:00','23:00','lead'],['16:00','00:00','bar']],
[['15:00','23:00','lead'],['17:00','01:00','bar']],

const monthStart=s=>dateISO(new Date(parseDate(s).getFullYear(),parseDate(s).getMonth(),1));
const stepMonth=(s,n)=>{const d=parseDate(s);return dateISO(new Date(d.getFullYear(),d.getMonth()+n,1))};
const fmtMonth=s=>parseDate(s).toLocaleDateString('cs-CZ',{month:'long',year:'numeric'});
function calendarWeeks(){if(ui.calendarMode==='week')return [ui.week];const start=mon(ui.month);const last=dateISO(new Date(parseDate(ui.month).getFullYear(),parseDate(ui.month).getMonth()+1,0));const result=[];for(let w=start;w<=last;w=addDays(w,7))result.push(w);return result}

function generateEventShifts(id){
 if(ui.mode!=='manager')return;
 const ev=state.events.find(x=>x.id===id);if(!ev)return;
 const already=generatedShiftsForEvent(ev);
 const req={lead:Number(ev.extraLead||0),bar:Number(ev.extraBar||0),support:Number(ev.extraSupport||0)};
 const defs=[];
 for(const role of ['lead','bar','support']){
  const existing=already.filter(s=>s.role===role).length;
  for(let i=existing;i<req[role];i++)defs.push(role);
 }
 if(!defs.length){toast('Všechny požadované posily už jsou v rozpisu.');return;}
 if(state.closures[ev.date]?.status==='approved'){toast('Pro tento den je uzávěrka schválená. Nejprve ji otevři.',true);return;}
 const mins=time=>{const [h,m]=time.split(':').map(Number);return h*60+m};
 const asClock=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
 const startM=mins(ev.start)-60;let endM=mins(ev.end)+60;
 if(endM<=startM)endM+=1440;
 if(endM-startM>720){toast('Akce je příliš dlouhá. Rozděl posily na kratší směny.',true);return;}
 ensureWeek(mon(ev.date));
 const created=[];
 defs.forEach(role=>{const shift={id:'s'+state.nextId++,date:ev.date,start:asClock(startM),end:asClock(endM),role,employeeId:null,eventId:ev.id};state.shifts.push(shift);created.push(shift.id);invalidatePublished(ev.date)});
 ev.generatedShiftIds=[...(ev.generatedShiftIds||[]),...created];
 event('Akce '+ev.title+' propsána do směn ('+created.length+' pozic).');persist();render();toast('Vytvořeno '+created.length+' posil do rozpisu.');
}

function editShiftDialog(s,isNew=false){ui.modal={type:'shift',id:s.id};const p=getPerson(s.employeeId),shInfo=fmtShort(s.date)+' · '+s.start+'–'+s.end+' · '+roleLabel(s);modal(`<form id="shift-form"><input type="hidden" name="id" value="${s.id}"><div class="formgrid"><div class="field"><label>Datum</label><input name="date" type="date" value="${s.date}" required></div><div class="field"><label>Pozice</label><select name="role">${Object.keys(roles).map(k=>`<option value="${k}" ${s.role===k?'selected':''}>${roles[k]}</option>`).join('')}</select></div><div class="field"><label>Začátek</label><input name="start" type="time" value="${s.start}" required></div><div class="field"><label>Konec</label><input name="end" type="time" value="${s.end}" required></div><div class="field full"><label>Zaměstnanec</label><select name="employeeId"><option value="">Neobsazeno</option>${state.people.map(e=>`<option value="${e.id}" ${s.employeeId===e.id?'selected':''}>${safe(e.name)} · ${e.skills.map(k=>roles[k]).join(', ')}</option>`).join('')}</select></div></div><div class="formactions"><div class="formactions-left">${isNew?'':`<button type="button" class="btn danger" data-action="deleteshift" data-id="${s.id}">${ico('x')} Smazat směnu</button>`}</div><button type="button" class="btn outline" data-action="modalclose">Zrušit</button><button class="btn primary" type="submit">${isNew?'Vytvořit směnu':'Uložit změny'}</button></div></form>`,isNew?'Nová směna':'Upravit směnu',shInfo)}
function openShift(id){const s=state.shifts.find(x=>x.id===id);if(!s)return;const isMgr=ui.mode==='manager';const p=getPerson(s.employeeId);const shInfo=fmtShort(s.date)+' · '+s.start+'–'+s.end+' · '+roleLabel(s);if(isMgr){editShiftDialog(s)}else if(p?.id===ui.person){const already=state.requests.some(r=>r.type==='release'&&r.shiftId===s.id&&r.employeeId===ui.person&&r.status==='pending');modal(`<div class="inlinebox"><b>${safe(shInfo)}</b><p>Směna je přiřazená tobě. O uvolnění musí rozhodnout manažer.</p></div>${already?`<div class="notice warn">Žádost už čeká na vyřízení.</div>`:`<form id="release-form"><input type="hidden" name="shiftId" value="${s.id}"><div class="field"><label>Poznámka (nepovinné)</label><textarea name="note" placeholder="Proč potřebuješ směnu uvolnit?"></textarea></div><div class="formactions"><button class="btn primary" type="submit">Nabídnout směnu</button></div></form>`}`,'Moje směna',shInfo)}else if(!p){const errs=violations(s,ui.person,s.id);const already=state.requests.some(r=>r.type==='claim'&&r.shiftId===s.id&&r.employeeId===ui.person&&r.status==='pending');modal(`<div class="inlinebox"><b>${safe(shInfo)}</b><p>Můžeš požádat o převzetí této směny.</p></div>${errs.length?`<div class="notice warn">${safe(errs.join('. '))}</div>`:''}<div class="formactions"><button class="btn primary" ${errs.length||already?'disabled':''} data-action="claim" data-id="${s.id}">${already?'Žádost odeslána':'Mám zájem'}</button></div>`,'Volná směna',shInfo)}else modal(`<div class="inlinebox">Na této směně pracuje ${safe(p.name)}. Změny provádí manažer.</div>`,'Obsazená směna',shInfo)}
function confirmDelete(id){const s=state.shifts.find(x=>x.id===id);if(!s)return;modal(`<div class="delete-confirm"><div class="delete-confirm-icon">${ico('alert')}</div><p>Odstraníš směnu <strong>${dateWeekday(s.date)} ${fmtShort(s.date)}, ${s.start}–${s.end}</strong>. Tato změna se projeví v rozpisu.</p><div class="formactions"><button class="btn outline" data-action="backshift" data-id="${id}">Zpět k úpravě</button><button class="btn danger-solid" data-action="confirmdelete" data-id="${id}">${ico('x')} Smazat směnu</button></div></div>`,'Smazat směnu?')}

function openLeave(){ui.modal={type:'leave'};modal(`<form id="leave-form"><div class="formgrid"><div class="field full"><label>Den volna</label><input name="date" type="date" min="${dateISO(new Date())}" value="${addDays(ui.week,5)}" required></div><div class="field full"><label>Poznámka (nepovinné)</label><textarea name="note" placeholder="Například: domluvená dovolená, osobní volno"></textarea></div></div><div class="formactions"><button type="submit" class="btn primary">Odeslat žádost</button></div></form>`,'Požádat o volno','Manažer žádost posoudí; rozpis se nezmění automaticky.')}
function approve(id){if(ui.mode!=='manager')return;const r=state.requests.find(x=>x.id===id);if(!r||r.status!=='pending')return;const s=state.shifts.find(x=>x.id===r.shiftId);if(s&&state.closures[s.date]?.status==='approved'){toast('Uzávěrka tohoto dne je schválená.',true);return}if(r.type==='claim'){if(!s||s.employeeId){toast('Směna už není volná.',true);return}const errs=violations(s,r.employeeId,s.id);if(errs.length){toast('Nelze schválit: '+errs[0],true);return}s.employeeId=r.employeeId;invalidatePublished(s.date)}else if(r.type==='release'){if(!s||s.employeeId!==r.employeeId){toast('Směna už změnila vlastníka.',true);return}s.employeeId=null;invalidatePublished(s.date)}else if(r.type==='leave'){if(!state.unavailable.some(u=>u.employeeId===r.employeeId&&u.date===r.date)){state.unavailable.push({employeeId:r.employeeId,date:r.date})}state.shifts.filter(x=>x.employeeId===r.employeeId&&x.date===r.date).forEach(x=>invalidatePublished(x.date))}
r.status='approved';event('Schválena žádost: '+reqTitle(r)+' · '+getPerson(r.employeeId).name);persist();render();toast('Žádost schválena.')}
function claim(id){const s=state.shifts.find(x=>x.id===id);if(!s||s.employeeId){toast('Směna už není volná.',true);return}const errs=violations(s,ui.person,s.id);if(errs.length){toast('Nelze požádat: '+errs[0],true);return}if(state.requests.some(r=>r.type==='claim'&&r.shiftId===id&&r.employeeId===ui.person&&r.status==='pending')){toast('Žádost už existuje.',true);return}state.requests.push({id:'r'+state.nextId++,type:'claim',employeeId:ui.person,shiftId:id,note:'Rád/a převezmu tuto směnu.',status:'pending',created:Date.now()});event('Nový zájem o směnu od '+getPerson(ui.person).name);persist();closeModal();render();toast('Žádost o převzetí směny odeslána.')}
function toast(msg,err){const box=document.getElementById('toast-root');const e=document.createElement('div');e.className='toast'+(err?' error':'');e.textContent=msg;box.append(e);setTimeout(()=>e.remove(),3900)}
function exportCSV(){const monthly=ui.view==='schedule'&&ui.calendarMode==='month';const header=['Datum','Den','Začátek','Konec','Pozice','Zaměstnanec','Hodiny','Náklad CZK'];const rows=(monthly?periodShifts():weekShifts()).map(s=>[s.date,dateWeekday(s.date),s.start,s.end,roles[s.role],getPerson(s.employeeId)?.name||'Neobsazeno',timing(s).hours,s.employeeId?timing(s).hours*getPerson(s.employeeId).rate:0]);const csv='\ufeff'+[header,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kellyxir-smeny-'+(monthly?ui.month.slice(0,7):ui.week)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV rozpis stažen.')}


// Cash closing: amounts stored as integer haler to avoid fractional-crown drift.
const moneyH=v=>Math.round((Number(v)||0)*100);
const moneyCZ=h=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',minimumFractionDigits:0,maximumFractionDigits:2}).format((Number(h)||0)/100);
const positiveH=v=>Math.max(0,moneyH(v));
function closureFor(date){return state.closures[date]||{date,status:'draft',opening:0,cash:0,card:0,tipCash:0,tipCard:0,counted:0,terminal:0,otherOut:0,note:'',varianceNote:'',payouts:{},eligible:{},createdBy:'',submittedAt:null,approvedAt:null}}
function closureFields(cl){return ['opening','cash','card','tipCash','tipCard','counted','terminal','otherOut'].reduce((obj,k)=>(obj[k]=Math.max(0,Math.round(Number(cl[k])||0)),obj),{})}
function staffForClosure(date){const map=new Map();state.shifts.filter(s=>s.date===date&&s.employeeId).forEach(s=>{const p=getPerson(s.employeeId);if(!p)return;let record=map.get(p.id);if(!record){record={id:p.id,person:p,hours:0,barHours:0,roles:new Set()};map.set(p.id,record)}const t=timing(s);record.hours+=t.hours;record.roles.add(s.role);if(s.role==='bar'||s.role==='lead')record.barHours+=t.hours});return [...map.values()].sort((a,b)=>a.person.name.localeCompare(b.person.name,'cs'))}
function isEligible(staff,cl){return Object.prototype.hasOwnProperty.call(cl.eligible||{},staff.id)?!!cl.eligible[staff.id]:staff.barHours>0}
function allocateH(total,workers,weightFn){const answer={};workers.forEach(x=>answer[x.id]=0);const pool=Math.max(0,Math.round(total));if(!pool||!workers.length)return answer;let weights=workers.map(w=>Math.max(0,weightFn(w)));if(!weights.some(Boolean))weights=workers.map(()=>1);const wsum=weights.reduce((a,b)=>a+b,0);const raw=weights.map(w=>pool*w/wsum);const floors=raw.map(Math.floor);let remainder=pool-floors.reduce((a,b)=>a+b,0);const order=workers.map((w,i)=>({i,f:raw[i]-floors[i],id:w.id})).sort((a,b)=>b.f-a.f||a.id.localeCompare(b.id));for(const o of order){if(remainder--<=0)break;floors[o.i]++}workers.forEach((w,i)=>answer[w.id]=floors[i]);return answer}
function settlement(date,override){const cl=override||closureFor(date);if(cl.status==='approved'&&cl.snapshot&&!override)return cl.snapshot;const c=closureFields(cl);const staff=staffForClosure(date), eligible=staff.filter(x=>isEligible(x,cl));const pct=Number(state.cashSettings?.sharePct??4);const sales=c.cash+c.card;const pool=Math.round(sales*pct/100);const tips=c.tipCash+c.tipCard;const weightFn=x=>state.cashSettings?.splitMode==='equal'?1:x.barHours;const bonuses=allocateH(pool,eligible,weightFn), tipsShares=allocateH(tips,eligible,weightFn);let paidCash=0,paidTransfer=0;
const rows=staff.map(x=>{const p=cl.payouts?.[x.id]||{};const base=Number.isFinite(Number(p.base))?Math.max(0,Math.round(Number(p.base))):moneyH(x.hours*x.person.rate);const fourPct=bonuses[x.id]||0;const tip=tipsShares[x.id]||0;const due=base+fourPct+tip;const cashPaid=Math.max(0,Math.round(Number(p.paidCash)||0));const transferPaid=Math.max(0,Math.round(Number(p.paidTransfer)||0));paidCash+=cashPaid;paidTransfer+=transferPaid;return {...x,base,fourPct,tip,due,cashPaid,transferPaid,remaining:due-cashPaid-transferPaid,eligible:isEligible(x,cl)}});
const expectedCash=c.opening+c.cash+c.tipCash-paidCash-c.otherOut;
const expectedTerminal=c.card+c.tipCard;
return {c,rows,sales,tips,pool,paidCash,paidTransfer,expectedCash,expectedTerminal,cashDiff:c.counted-expectedCash,cardDiff:c.terminal-expectedTerminal,unpaid:rows.reduce((n,x)=>n+x.remaining,0),hasStaff:staff.length>0,eligibleCount:eligible.length,unallocated:eligible.length===0&&(pool+tips)>0};}
function cashStatus(status){return `<span class="cash-status ${safe(status)}">${status==='approved'?'Schváleno':status==='pending'?'Čeká na kontrolu':'Rozpracováno'}</span>`}
function cashField(label,key,value,hint='',full=false,readonly=false){return `<div class="cash-field ${full?'full':''}"><label for="cl-${key}">${label}${hint?`<span>${hint}</span>`:''}</label><input id="cl-${key}" type="number" inputmode="decimal" name="${key}" min="0" max="100000000" step="0.01" value="${(value/100).toFixed(2)}" ${readonly?'disabled':''} required></div>`}
function cashView(){const isMgr=ui.mode==='manager';const date=ui.cashDate||dateISO(new Date());const cl=closureFor(date), calc=settlement(date);const locked=cl.status==='approved'||(cl.status==='pending'&&!isMgr);const totalPaid=calc.paidCash+calc.paidTransfer;
 const self=calc.rows.find(x=>x.id===ui.person);
 const statBlock=(label,number,note,alert=false)=>`<div class="cash-stat ${alert?'alert':''}"><small>${label}</small><strong class="cash-float" id="${label==='Tržba dne'?'cash-live-sales':label==='Spropitné'?'cash-live-tips':label.startsWith('Rozdělení ')?'cash-live-pool':'cash-live-paid'}">${moneyCZ(number)}</strong><em>${note}</em></div>`;
 const queue=isMgr?Object.values(state.closures||{}).filter(x=>x.status==='pending').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6):[];const queueStrip=queue.length?`<div class="cash-queue"><b>Ke schválení ${queue.length}</b>${queue.map(x=>`<button data-action="pickclosure" data-id="${x.date}">${fmtShort(x.date)} ${x.date===date?'✓':''}</button>`).join('')}</div>`:'';
 const controls=`<div class="cash-headrow"><div class="field"><label for="closure-date">Provozní den</label><input id="closure-date" type="date" value="${date}" aria-label="Datum uzávěrky"></div>${cashStatus(cl.status)}</div>`;
 const info='';

function payoutDialog(id){if(ui.mode!=='manager')return;const date=ui.cashDate, cl=closureFor(date),calc=settlement(date),item=calc.rows.find(x=>x.id===id);if(!item||cl.status==='approved')return;const actual=cl.payouts?.[id]||{};modal(`<form id="payout-form"><input name="id" type="hidden" value="${id}"><div class="cash-own"><h3>${safe(item.person.name)}</h3><div class="cash-reconcile-row"><span>Rozdělení 4 % tržeb</span><b>${moneyCZ(item.fourPct)}</b></div><div class="cash-reconcile-row"><span>Spropitné</span><b>${moneyCZ(item.tip)}</b></div><div class="cash-reconcile-row"><span>Celkem k vyúčtování</span><b>${moneyCZ(item.due)}</b></div></div><div class="formgrid"><div class="field full"><label>Základ k vyúčtování (Kč)</label><input name="base" type="number" min="0" step="0.01" value="${(item.base/100).toFixed(2)}" required></div><div class="field"><label>Skutečně vyplaceno v hotovosti (Kč)</label><input name="paidCash" type="number" min="0" step="0.01" value="${(item.cashPaid/100).toFixed(2)}" required></div><div class="field"><label>Skutečně vyplaceno převodem (Kč)</label><input name="paidTransfer" type="number" min="0" step="0.01" value="${(item.transferPaid/100).toFixed(2)}" required></div></div><div class="formactions"><button class="btn outline" type="button" data-action="modalclose">Zpět</button><button class="btn primary" type="submit">Uložit výplatu</button></div></form>`,'Vyúčtování zaměstnance',fmtShort(date));}

function exportClosureCSV(){

 const header=['Datum','Zaměstnanec','Hodiny dle rozpisu','Základ model Kč','Podíl Kč','Spropitné Kč','Celkem Kč','Vyplaceno hotově Kč','Vyplaceno převodem Kč','Zbývá Kč','Stav uzávěrky','Tržba hotově Kč','Tržba karta Kč','Dýška hotově Kč','Dýška karta Kč','Očekávaná kasa Kč','Spočítaná kasa Kč','Rozdíl kasa Kč','Rozdíl terminál Kč'];
 const rows=(s.rows.length?s.rows:[null]).map(r=>[date,r?.person.name||'',r?r.hours.toFixed(2).replace('.',','):'',r?asNum(r.base):'',r?asNum(r.fourPct):'',r?asNum(r.tip):'',r?asNum(r.due):'',r?asNum(r.cashPaid):'',r?asNum(r.transferPaid):'',r?asNum(r.remaining):'',cl.status,asNum(s.c.cash),asNum(s.c.card),asNum(s.c.tipCash),asNum(s.c.tipCard),asNum(s.expectedCash),asNum(s.c.counted),asNum(s.cashDiff),asNum(s.cardDiff)]);
 const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv='\ufeff'+[header,...rows].map(row=>row.map(esc).join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='kellyxir-uzaverka-'+date+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Uzávěrka exportována.');
}
